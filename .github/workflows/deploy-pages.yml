name: Deploy to GitHub Pages

# 已停用自动部署（2026-09-15）：正式站已迁到 Cloudflare Pages（staff.hro.net.cn），
# 本工作流不再随 push 自动运行，仅保留手动触发（workflow_dispatch）备用。
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (base = /<repo>/)
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # GitHub Pages 上没有同源代理，继续走腾讯云 SCF 代理（Cloudflare 部署才用同源）
          VITE_API_PROXY: https://1466594404-6b17scw4l5.ap-guangzhou.tencentscf.com
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - uses: actions/deploy-pages@v4
        id: deployment
